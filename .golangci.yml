version: "2"

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
#    - revive
#    - gosec
  settings:
    govet:
      enable-all: true
    errcheck:
      check-type-assertions: true

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
